<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jai Shree Ram Navyuvak Samiti</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6f00">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--saffron:#ff6f00;--deep:#e65100;--bg:#fff5ec;--green:#2e7d32;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#292929}
.header{width:100%;background:#fff}.header-img{width:100%;height:auto;display:block}
.tabs{display:flex;background:var(--saffron);overflow-x:auto;position:sticky;top:0;z-index:20;scrollbar-width:thin}
.tabs div{padding:12px 14px;color:white;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs div.active{background:white;color:var(--saffron);border-radius:10px 10px 0 0;font-weight:700}
#app{padding:12px;max-width:1100px;margin:auto}
.title{padding:8px 0 14px;font-weight:bold;color:#444;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.festival-folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.festival-folder{cursor:pointer;min-height:130px;background:linear-gradient(145deg,#fff8e8,#fff);border:1px solid #f0d7a5;border-radius:16px;padding:16px;box-shadow:0 5px 14px #7c4b1515;position:relative}.festival-folder:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#ff8f00,#ffd54f);border-radius:16px 16px 0 0}.folder-icon{font-size:32px}.festival-folder h4{margin:8px 0 4px}.festival-folder small{color:#795548}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 3px 10px #00000012;position:relative;overflow:hidden;margin:8px 0}
.card:before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:var(--saffron)}
.card.dashboard-link{cursor:pointer;transition:transform .15s}.card.dashboard-link:active{transform:scale(.98)}.card.dashboard-link:focus{outline:2px solid var(--saffron)}
.big{font-size:21px;font-weight:800;color:var(--saffron);margin-top:7px;overflow-wrap:anywhere}
.green .big{color:var(--green)} .red .big{color:var(--red)}
input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border-radius:9px;border:1px solid #ddd;background:#fff;font:inherit}
button{background:var(--saffron);color:white;border:0;padding:10px 13px;border-radius:9px;margin:4px 4px 4px 0;font-weight:650;cursor:pointer}
button.secondary{background:#555}button.danger{background:var(--red)}button:disabled{opacity:.5}
label{display:block;font-weight:650;margin-top:6px;font-size:14px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
table{width:100%;border-collapse:collapse;background:white;margin:8px 0;font-size:14px}
th,td{border:1px solid #eee;padding:8px;text-align:left;vertical-align:middle}
th{background:#fff0e2}
.table-wrap{overflow:auto}
small,.muted{color:#666}.notice{padding:10px 12px;background:#fff0d8;border-radius:10px;margin:8px 0;font-size:13px}
.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#fff0d8;font-size:12px}
.empty{padding:16px;background:white;border-radius:10px;color:#666}
#loader{position:fixed;inset:0;background:linear-gradient(135deg,#ff9933,#ff5722);display:flex;align-items:center;justify-content:center;z-index:999999}
#loader img{width:min(260px,65vw);filter:drop-shadow(0 0 25px orange);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}#app{padding:20px}.tabs div{padding:14px 18px}}

/* Record actions are hidden until a deliberate long press */
.record-actions{display:none;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line,#ddd)}
.record-card.actions-open .record-actions{display:flex}
.record-card.actions-open{outline:2px solid #f59e0b}
.record-actions button{min-height:42px;padding:10px 14px}
.record-card{ -webkit-user-select:none; user-select:none; touch-action:pan-y }
.record-card input,.record-card select,.record-card textarea{ -webkit-user-select:text; user-select:text }
.longpress-hint{font-size:12px;opacity:.68;margin-top:8px}
</style>
</head>
<body>
<div id="loader"><img src="https://i.ibb.co/7Ny3fJTk/1000193664-removebg-preview.png" alt="Loading"></div>
<div class="header"><img src="https://i.ibb.co/60VBLD0J/1000195482-modified.png" class="header-img" alt="Jai Shree Ram Navyuvak Samiti"></div>
<nav class="tabs">
<div data-page="dashboard" class="active" onclick="page('dashboard',this)">🏠 Dashboard</div>
<div data-page="members" onclick="page('members',this)">👨🏻‍💼 Members</div>
<div data-page="monthly" onclick="page('monthly',this)">📅 Monthly</div>
<div data-page="utsav" onclick="page('utsav',this)">🎊 Utsav</div>
<div data-page="interest" onclick="page('interest',this)">💰 ब्याज रजिस्टर</div>
<div data-page="income" onclick="page('income',this)">📥 Income</div>
<div data-page="expense" onclick="page('expense',this)">📤 Expense</div>
<div data-page="settings" onclick="page('settings',this)">⚙️ Settings</div>
</nav>
<main id="app"></main>
<script>
"use strict";
let db, app;
let role = "viewer";
let year = new Date().getFullYear();
let passwords = {admin:"123",adhyaksha:"111",upadhyaksha:"222",member:"333"};
let approvals = {adhyaksha:false,upadhyaksha:false,member:false};
let activePage = "dashboard";
const months = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
const utsavList = ["Hanuman Janmotsav","Navratri","Ganesh Chaturthi","Laxmi Utsav"];
const money = n => "₹" + (Number(n)||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yearRef = () => db.ref("data/"+year);
const path = p => db.ref("data/"+year+"/"+p);
const isAdmin = () => role === "admin";
function init(){
  app=document.getElementById("app");
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyCkeJUlGX7Rd42uPkDJkLqaxvHLlrvezUg",
      databaseURL:"https://samiti-app5-default-rtdb.asia-southeast1.firebasedatabase.app"
    });
    db=firebase.database();
  }catch(e){console.error(e)}
  if(!db){app.innerHTML='<div class="notice">Firebase initialize नहीं हो पाया। इंटरनेट और Firebase configuration जाँचें।</div>';hideLoader();return}
  yearRef().once("value").then(s=>{
    if(!s.exists()) return yearRef().set({monthly:{},utsav:{},income:{},expense:{},utsavLoans:{}});
  }).catch(console.error).finally(()=>{
    db.ref("settings/passwords").once("value").then(s=>{if(s.val())passwords={...passwords,...s.val()}}).catch(console.error);
    db.ref("settings/approvals").on("value",s=>{approvals={...approvals,...(s.val()||{})}});
    hideLoader();
    dashboard();
    setInterval(()=>{const now=new Date().getFullYear();if(now!==year){year=now;page("dashboard")}},60000);
  });
}
function hideLoader(){const el=document.getElementById("loader");if(el)el.style.display="none"}
function page(p,el){
  activePage=p;
  document.querySelectorAll(".tabs div").forEach(t=>t.classList.toggle("active",t.dataset.page===p));
  const fn={dashboard,members,monthly,utsav,interest,income,expense,settings}[p];
  if(fn)fn();
}
function sumAmounts(obj){return Object.values(obj||{}).reduce((s,v)=>s+(Number(v?.a)||0),0)}
function penalty(date){if(!date)return 0;const d=new Date(date+"T12:00:00");return d.getDate()>1?(d.getDate()-1)*10:0}
async function readYear(){const s=await yearRef().once("value");return s.val()||{}}
async function getOpening(){const s=await db.ref("settings/open").once("value");return Number(s.val())||0}
function isFestivalCollectionKey(key, value, festival){
  // Support current memberId_festival keys and older festival-first/nested records.
  if(String(key).endsWith("_"+festival) || String(key).startsWith(festival+"_")) return true;
  if(value && typeof value === "object" && value.festival === festival) return true;
  return false;
}
function festivalAmount(value){
  if(value && typeof value === "object") return Number(value.a ?? value.amount ?? value.collection ?? value.paid) || 0;
  return Number(value) || 0;
}
async function festivalLedger(d,festival){
  let collections=0;
  Object.entries(d.utsav||{}).forEach(([k,v])=>{
    if(isFestivalCollectionKey(k,v,festival)) collections+=festivalAmount(v);
    else if(k===festival && v && typeof v==="object") collections+=Object.values(v).reduce((a,x)=>a+festivalAmount(x),0);
  });
  const expenses=Object.values(d.expense||{}).reduce((s,v)=>s+((v?.festival===festival || v?.utsav===festival || v?.festivalName===festival)?festivalAmount(v):0),0);
  const otherIncome=Object.values(d.income||{}).reduce((s,v)=>s+((v?.festival===festival || v?.utsav===festival || v?.festivalName===festival)?festivalAmount(v):0),0);
  const loans=Object.values(d.utsavLoans||{}).filter(v=>v.festival===festival);
  const lent=loans.reduce((s,v)=>s+(v.status==="returned"?0:Number(v.principal)||0),0);
  return {collections,expenses,otherIncome,loans,lent,balance:collections+otherIncome-expenses-lent};
}
async function dashboard(){
  app.innerHTML=`<div class="title">📊 Dashboard <select id="yearSelect" style="max-width:130px" onchange="changeYear(this.value)"></select>
  <button onclick="downloadPDF()">📄 PDF</button><button onclick="backupData()">💾 Backup</button><button onclick="installApp()">📲 Install</button></div><div id="dashNotice" class="notice">हिसाब लोड हो रहा है...</div><div class="cards" id="out"></div><h3>🎊 उत्सववार शेष राशि</h3><div id="festivalBalances" class="cards"></div>`;
  loadYears();
  try{
    const [d,open]=await Promise.all([readYear(),getOpening()]);
    const monthly=sumAmounts(d.monthly), utsav=sumAmounts(d.utsav), inc=sumAmounts(d.income), exp=sumAmounts(d.expense);
    const pen=Object.values(d.monthly||{}).reduce((s,v)=>s+penalty(v.d),0);
    const loans=Object.values(d.utsavLoans||{});
    const pendingPrincipal=loans.filter(v=>v.status!=="returned").reduce((s,v)=>s+(Number(v.principal)||0),0);
    const interestReceived=loans.reduce((s,v)=>s+(Number(v.interestReceived)||0),0);
    const cash=open+monthly+pen+utsav+inc-exp-pendingPrincipal+interestReceived;
    document.getElementById("dashNotice").textContent="वर्ष "+year+" का वित्तीय सारांश";
    document.getElementById("out").innerHTML=[
      ["💰 Opening",open],["🗓️ Monthly",monthly],["🧾 Penalty",pen],["🎊 Utsav",utsav],
      ["📥 Other Income",inc],["📤 Expense",exp],["🤝 उधार मूलधन बाकी",pendingPrincipal],
      ["💹 ब्याज प्राप्त",interestReceived],["🏦 उपलब्ध नकद",cash]
     ].map(([t,n])=>{const dest=t.includes("Monthly")||t.includes("Penalty")?"monthly":t.includes("Utsav")?"utsav":t.includes("Expense")?"expense":t.includes("Income")?"income":t.includes("उधार")||t.includes("ब्याज")?"interest":t.includes("Opening")?"settings":null;return `<div class="card dashboard-link" ${dest?`onclick="page('${dest}')" role="button" tabindex="0"`:""}><div>${t}</div><div class="big">${money(n)}</div>${dest?"<small>देखने के लिए टच करें ↗</small>":""}</div>`}).join("");
    const balances=await Promise.all(utsavList.map(async f=>[f,await festivalLedger(d,f)]));
    document.getElementById("festivalBalances").innerHTML=balances.map(([f,x])=>`<div class="card dashboard-link" role="button" tabindex="0" onclick="openFestival('${esc(f)}')"><b>📁 ${esc(f)}</b><div class="big">${money(x.balance)}</div><small>चंदा ${money(x.collections)} · खर्च ${money(x.expenses)} · उधार बाकी ${money(x.lent)}</small><small>सभी हिसाब एक साथ देखने के लिए टच करें ↗</small></div>`).join("");
  }catch(e){console.error(e);document.getElementById("dashNotice").textContent="डेटा लोड नहीं हुआ: "+e.message}
}
async function loadYears(){
 const sel=document.getElementById("yearSelect");if(!sel)return;
 try{const s=await db.ref("data").once("value");const ys=Object.keys(s.val()||{}).filter(k=>/^\d{4}$/.test(k));if(!ys.includes(String(year)))ys.push(String(year));ys.sort();sel.innerHTML=ys.map(y=>`<option value="${y}" ${Number(y)===year?"selected":""}>${y}</option>`).join("")}catch(e){sel.innerHTML=`<option>${year}</option>`}
}
function changeYear(v){year=Number(v)||new Date().getFullYear();page(activePage)}
async function members(){
 app.innerHTML=`<h3>👨🏻‍💼 सदस्य प्रबंधन</h3><div class="card"><label>सदस्य का नाम</label><input id="memberName" placeholder="नाम"><label>पद</label><input id="memberPost" placeholder="पद"><button onclick="addMember()">सदस्य जोड़ें</button></div><h3>सदस्य सूची</h3><div id="memberList">लोड हो रहा है...</div>`;
 try{const s=await db.ref("members").once("value");const data=s.val()||{};const list=document.getElementById("memberList");
 if(!Object.keys(data).length){list.innerHTML='<div class="empty">अभी सदस्य नहीं हैं।</div>';return}
 list.innerHTML=Object.entries(data).map(([id,v],i)=>`<div class="card record-card"><b>${i+1}. ${esc(v.name)}</b><div class="row"><input id="mn_${id}" value="${esc(v.name)}" aria-label="नाम"><input id="mp_${id}" value="${esc(v.post||"")}" aria-label="पद"></div><div class="longpress-hint">विकल्प देखने के लिए यहाँ देर तक दबाएँ</div><div class="record-actions"><button onclick="updateMember('${id}')">अपडेट</button><button class="danger" onclick="deleteMember('${id}')">हटाएँ</button></div></div>`).join("");
 }catch(e){document.getElementById("memberList").textContent="लोड नहीं हुआ: "+e.message}
}
async function addMember(){if(!isAdmin())return alert("केवल Admin सदस्य जोड़ सकता है");const n=document.getElementById("memberName").value.trim(),p=document.getElementById("memberPost").value.trim();if(!n)return alert("नाम लिखें");try{await db.ref("members").push({name:n,post:p});members()}catch(e){alert(e.message)}}
async function updateMember(id){if(!isAdmin())return alert("केवल Admin अपडेट कर सकता है");const name=document.getElementById("mn_"+id).value.trim(),post=document.getElementById("mp_"+id).value.trim();if(!name)return alert("नाम खाली नहीं हो सकता");try{await db.ref("members/"+id).update({name,post});alert("सदस्य अपडेट हुआ")}catch(e){alert(e.message)}}
async function deleteMember(id){if(!isAdmin())return alert("केवल Admin हटा सकता है");if(!confirm("क्या इस सदस्य को हटाना है? पुराने भुगतान रिकॉर्ड बने रहेंगे।"))return;try{await db.ref("members/"+id).remove();members()}catch(e){alert(e.message)}}
function monthly(){
 app.innerHTML=`<h3>📅 मासिक भुगतान</h3><label>महीना</label><select id="month" onchange="loadMonthly()">${months.map(m=>`<option>${m}</option>`).join("")}</select><div id="monthlyList"></div>`;
 loadMonthly();
}
async function loadMonthly(){
 const list=document.getElementById("monthlyList");if(!list)return;
 try{const [ms,ds]=await Promise.all([db.ref("members").once("value"),path("monthly").once("value")]);const mem=ms.val()||{},data=ds.val()||{},mth=document.getElementById("month").value;
 list.innerHTML=Object.entries(mem).map(([id,v],i)=>{const k=id+"_"+mth,val=data[k]||{};return `<div class="card"><b>${i+1}. ${esc(v.name)}</b><div class="row"><div><label>राशि ₹</label><input type="number" min="0" id="ma_${id}" value="${val.a??""}"></div><div><label>भुगतान तारीख</label><input type="date" id="md_${id}" value="${esc(val.d||"")}"></div></div><small>जुर्माना: ${money(penalty(val.d))}</small><br><button onclick="saveMonthly('${k}','${id}')">सेव</button></div>`}).join("")||'<div class="empty">पहले सदस्य जोड़ें।</div>';
 }catch(e){list.textContent=e.message}
}
async function saveMonthly(key,id){if(!isAdmin())return alert("केवल Admin सेव कर सकता है");const a=document.getElementById("ma_"+id).value,d=document.getElementById("md_"+id).value;if(a!==""&&(!Number.isFinite(Number(a))||Number(a)<0))return alert("राशि सही भरें");try{const old=(await path("monthly/"+key).once("value")).val()||{};if(!canEdit(old))return alert("Locked record: approval आवश्यक");await path("monthly/"+key).update({a:a===""?"":Number(a),d,locked:false});resetApproval();loadMonthly()}catch(e){alert(e.message)}}
function canEdit(v){if(!v||((!v.a)&&(!v.d)))return true;if(!isAdmin())return false;if(v.locked===undefined||v.locked===false)return true;return v.locked===true&&approvals.adhyaksha&&approvals.upadhyaksha&&approvals.member}
function resetApproval(){db.ref("settings/approvals").set({adhyaksha:false,upadhyaksha:false,member:false})}
function utsav(){
 app.innerHTML=`<h3>🎊 उत्सव रजिस्टर</h3><p class="notice">किसी उत्सव के फोल्डर पर टच करके उसका चंदा, अन्य आय और खर्च एक साथ देखें।</p><div id="festivalFolders" class="festival-folders"></div><hr><h3>🧾 सदस्यवार चंदा दर्ज करें</h3><label>उत्सव चुनें</label><select id="festival" onchange="loadUtsav()">${utsavList.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select><div id="utsavList"></div><button onclick="saveAllUtsav()">💾 सभी भुगतान सेव करें</button>`;
  document.getElementById("festivalFolders").innerHTML=utsavList.map(f=>`<div class="festival-folder" role="button" tabindex="0" onclick="openFestival('${esc(f)}')"><div class="folder-icon">📁</div><h4>${esc(f)}</h4><small>Collection · Income · Expenses</small></div>`).join("");
 loadUtsav();
}
async function openFestival(f){
 app.innerHTML=`<div class="title"><button onclick="page('utsav')">← वापस</button><h3>📁 ${esc(f)} — पूरा हिसाब</h3></div><div id="festivalDetail"><div class="notice">हिसाब लोड हो रहा है...</div></div>`;
 try{
  const [d,ms]=await Promise.all([readYear(),db.ref("members").once("value")]),mem=ms.val()||{},ledger=await festivalLedger(d,f);
  const collections=[];
  Object.entries(d.utsav||{}).forEach(([k,v])=>{
    if(isFestivalCollectionKey(k,v,f)){
      let id=String(k).endsWith("_"+f)?String(k).slice(0,-(f.length+1)):String(k).startsWith(f+"_")?String(k).slice(f.length+1):(v?.memberId||k);
      collections.push({name:mem[id]?.name||v?.memberName||id,amount:festivalAmount(v)});
    } else if(k===f && v && typeof v==="object") Object.entries(v).forEach(([id,x])=>collections.push({name:mem[id]?.name||x?.memberName||id,amount:festivalAmount(x)}));
  });
  const incomes=Object.entries(d.income||{}).filter(([k,v])=>v.festival===f || v.utsav===f || v.festivalName===f).map(([id,v])=>({id,...v}));
  const expenses=Object.entries(d.expense||{}).filter(([k,v])=>v.festival===f || v.utsav===f || v.festivalName===f).map(([id,v])=>({id,...v}));
  const loans=Object.entries(d.utsavLoans||{}).filter(([k,v])=>v.festival===f).map(([id,v])=>({id,...v}));
  const cur=n=>money(Number(n)||0);
  document.getElementById("festivalDetail").innerHTML=`<div class="cards"><div class="card"><small>कुल चंदा</small><div class="big">${cur(ledger.collections)}</div></div><div class="card"><small>अन्य आय</small><div class="big">${cur(ledger.otherIncome)}</div></div><div class="card"><small>कुल खर्च</small><div class="big">${cur(ledger.expenses)}</div></div><div class="card"><small>उधार मूलधन बाकी</small><div class="big">${cur(ledger.lent)}</div></div><div class="card"><small>शेष राशि</small><div class="big">${cur(ledger.balance)}</div></div></div>
  <h3>👥 सदस्यवार चंदा</h3>${collections.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.name)}</b><div class="big">${cur(x.amount)}</div></div>`).join("")||'<div class="empty">अभी कोई चंदा दर्ज नहीं है।</div>'}
  <h3>📥 अन्य आय</h3>${incomes.map(x=>`<div class="card"><b>${esc(x.desc||x.description||"आय")}</b><div>${esc(x.d||x.date||"-")} · ${cur(x.a)}</div></div>`).join("")||'<div class="empty">इस उत्सव की अन्य आय नहीं है।</div>'}

function calculateLoan(principal,date){
 const amount=Number(principal),start=new Date(date+"T12:00:00"),due=new Date(start);due.setFullYear(due.getFullYear()+1);
 const interest=Math.round(amount*0.30*100)/100;
 return {interest,total:Math.round((amount+interest)*100)/100,dueDate:[due.getFullYear(),String(due.getMonth()+1).padStart(2,"0"),String(due.getDate()).padStart(2,"0")].join("-")};
}

}

<script>
// Long-press opens a persistent action panel; it stays open until another card is opened or user taps outside.
(function(){
 let timer=null, target=null, startX=0, startY=0, moved=false;
 const clearTimer=()=>{if(timer)clearTimeout(timer);timer=null};
 document.addEventListener('touchstart',e=>{
   const card=e.target.closest('.record-card');
   if(!card||e.target.closest('button,input,select,textarea,a'))return;
   clearTimer(); target=card; moved=false;
   startX=e.touches[0].clientX; startY=e.touches[0].clientY;
   timer=setTimeout(()=>{
     if(target&&!moved){
       document.querySelectorAll('.record-card.actions-open').forEach(c=>{if(c!==target)c.classList.remove('actions-open')});
       target.classList.add('actions-open');
       if(navigator.vibrate)navigator.vibrate(25);
     }
   },600);
 },{passive:true});
 document.addEventListener('touchmove',e=>{
   if(!timer||!e.touches||!e.touches[0])return;
   const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
   if(Math.abs(dx)>14||Math.abs(dy)>14){moved=true;clearTimer()}
 },{passive:true});
 document.addEventListener('touchend',clearTimer,{passive:true});
 document.addEventListener('touchcancel',clearTimer,{passive:true});
 document.addEventListener('contextmenu',e=>{
   const card=e.target.closest('.record-card');if(!card)return;e.preventDefault();
   document.querySelectorAll('.record-card.actions-open').forEach(c=>{if(c!==card)c.classList.remove('actions-open')});
   card.classList.add('actions-open');
 });
 document.addEventListener('click',e=>{
   if(e.target.closest('.record-card'))return;
   document.querySelectorAll('.record-card.actions-open').forEach(c=>c.classList.remove('actions-open'));
 });
})();
</script>
